<style>
:root{--bg:#101112;--bg2:#17191B;--card:#1D2023;--line:#2B2F33;--tx:#F2F3F4;--tx2:#8F969D;--ac:#9BB5A3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'Schibsted Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
nav{position:fixed;z-index:5;background:var(--bg2);border-top:1px solid var(--line);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;display:flex;justify-content:space-around}
nav{overflow-x:auto}nav button{flex:1 0 auto;background:none;border:0;color:var(--tx2);padding:14px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:28px 20px 160px}
h1{font-size:15px;font-weight:500;color:var(--tx2);margin:0 0 4px}
h2{font-size:13px;font-weight:500;color:var(--tx2);margin:40px 0 12px}
.big{font-size:44px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:0}
.big small{font-size:20px;color:var(--tx2);font-weight:400}
.sub{color:var(--tx2);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.row .m{color:var(--tx2);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}
button.b,.fab{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
button.b:hover{border-color:var(--tx2)}
button.p,.fab{background:var(--ac);color:#101112;border-color:var(--ac);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
textarea{resize:none}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.f .w{grid-column:1/-1}
label{display:grid;gap:4px;color:var(--tx2);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.run{background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:16px;margin:24px 0 0}
.run .big{color:var(--ac)}
.note{color:var(--tx2);font-size:13px;border-left:2px solid var(--line);padding-left:12px;margin:16px 0}
.empty{color:var(--tx2);padding:12px 0}
.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 16px #0008}
#cap{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0;z-index:10}
#cap.on{display:flex}
#cap div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:520px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:11}
#toast.on{opacity:1}
@media(min-width:800px){
nav{top:0;bottom:0;right:auto;width:190px;flex-direction:column;justify-content:flex-start;padding:28px 12px;border-top:0;border-right:1px solid var(--line)}
nav button{flex:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px}
main{margin-left:190px;max-width:none;padding:48px 48px 120px}
main>*{max-width:680px}
.fab{left:14px;right:auto;bottom:24px;width:162px}
#toast{bottom:32px}
}
#lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}#lg.on{display:flex}#lg div{width:100%;max-width:340px;display:grid;gap:12px}#lgm{color:var(--tx2);font-size:13px;min-height:18px;margin:0}
.m{color:var(--tx2);font-size:13px}.note b{font-weight:500;color:var(--tx)}
.fbtn{padding:16px 28px;font-size:16px;min-width:220px}
#foco{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px)}
#foco.on{display:flex}
#foco .fl{font-size:12px;letter-spacing:.14em;color:var(--tx2);margin:0 0 20px}
#foco h1{font-size:22px;font-weight:500;color:var(--tx);margin:0;overflow-wrap:anywhere}
.ftm{font-size:clamp(52px,17vw,104px);font-weight:500;letter-spacing:-.02em;margin:28px 0 12px}
#foco .fh{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;color:var(--tx2);opacity:.7;margin:0}
#fc{position:absolute;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:24px}
#fc.on{display:flex}
#fc>div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:340px;text-align:left}
#fc p{margin:0 0 6px}#fc .acts{margin-top:16px}
.fz{margin-top:12px;width:100%;background:none!important;border-color:transparent!important;color:var(--tx2)!important}
.hl details{margin:0;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--tx)}
.hl summary{font-size:15px}.hl details p{color:var(--tx2);margin:10px 0 0}
details{margin-top:40px;color:var(--tx2);font-size:14px}summary{cursor:pointer;font-size:13px}details p{margin:10px 0}
@media print{nav,.fab,#cap,#toast,.acts{display:none!important}body,:root{background:#fff!important;color:#000!important;--bg:#fff;--bg2:#fff;--card:#fff;--line:#ccc;--tx:#000;--tx2:#555}main{margin:0!important;padding:0!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="capbtn">+ Captura rápida</button>
<div id="cap"><div>
<textarea id="cti" rows="3" placeholder="O que você precisa lembrar?"></textarea>
<div class="row" style="border:0;padding-bottom:0">
<button class="b" id="mic">Microfone</button>
<div class="acts"><button class="b" id="cx">Fechar</button><button class="b p" id="cs">Salvar</button></div>
</div></div></div>
<div id="lg"><div><h1 style="font-size:22px;color:var(--tx);margin:0 0 8px;font-weight:500">MIGUEL OS</h1><input id="lge" type="email" autocomplete="username" placeholder="E-mail"><input id="lgp" type="password" autocomplete="current-password" placeholder="Senha"><p id="lgm"></p><button class="b p" id="lgi">Entrar</button><button class="b" id="lgc">Criar conta</button><p class="m" style="margin:0;font-size:12px;color:var(--tx2)">v5</p></div></div>
<div id="foco"><div><p class="fl">MODO FOCO</p><h1 id="fa"></h1><p class="ftm" id="ft">00:00:00</p><p class="m" id="fs"></p><button class="b p fbtn" style="margin-top:40px" data-a="fq">Finalizar sessão</button></div><p class="fh">Agora existe apenas uma coisa para fazer.</p><div id="fc"><div><p>Finalizar sessão?</p><p class="m">O tempo será registrado como executado.</p><div class="acts"><button class="b" data-a="fn">Continuar</button><button class="b p" id="fy" data-a="fin">Finalizar</button></div><button class="b fz" id="fz" data-a="ab">Interromper sem concluir</button></div></div></div>
<div id="toast"></div>
<script>
const K='miguelos.v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{caps:[],proj:[],ses:[],cats:['Evastek / Dinheiro','Inglês','Marketing / Estudos','Trabalho','Projetos','Pessoal','Exercício','Outros']};
S.ev=S.ev||[];S.ideas=S.ideas||[];S.ref=S.ref||{};
S.rot=S.rot||'06:00 Acordar\n06:40 Sair para o trabalho\n07:00 Trabalho\n17:30 Chegar em casa\n18:00 Inglês\n19:00 Evastek / Dinheiro\n20:00 Jantar / descanso\n20:30 Estudo ou tarefa secundária\n21:15 Tempo pessoal\n22:00 Desacelerar\n22:30 Dormir';
const DC=['Evastek / Dinheiro','Inglês','Marketing / Estudos','Trabalho','Projetos','Pessoal','Exercício','Outros'];
const NR='06:00 Acordar\n06:10 Se arrumar\n06:20 Ler a Bíblia\n06:30 Oração e reflexão\n06:40 Sair para o trabalho\n07:00 Trabalho\n17:30 Chegar em casa / tomar banho\n18:00 Inglês\n19:00 Evastek / Dinheiro\n20:00 Jantar / descanso\n20:30 Estudo ou tarefa secundária\n21:15 Tempo pessoal\n22:00 Desacelerar\n22:30 Dormir';
const fix=o=>{['caps','proj','ses','ev','ideas'].forEach(k=>o[k]=o[k]||[]);o.ref=o.ref||{};if(!o.cats||!o.cats.length)o.cats=DC;if(!o.rot||o.rot.startsWith('06:00 Acordar\n06:40 Sair para o trabalho'))o.rot=NR;o.caps.forEach(c=>{if(c.type==='Tarefa'&&c.done===undefined)c.done=false});return o};
S=fix(S);
const save=()=>{S._t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}window.cloudPush&&window.cloudPush()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dur=m=>{m=Math.max(0,Math.round(m));return m<60?m+'min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const day=t=>new Date(t).toDateString();
const hm=t=>new Date(t).toTimeString().slice(0,5);
const plan=s=>(s.pe-s.ps)/6e4;
const act=s=>s.st==='done'?(s.re-s.rs)/6e4:s.st==='running'?(Date.now()-s.rs)/6e4:(s.st==='abandoned'&&s.rs&&s.re)?(s.re-s.rs)/6e4:0;
const tm=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const SUB=['ideias','evastek','ajuda','rotina'];
const VIEWS=[['hoje','Hoje'],['entrada','Entrada'],['sessoes','Sessões'],['projetos','Projetos'],['rel','Relatórios'],['mais','Mais']];
let V='hoje',toastT,RP=7;
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||1800)}
function pct(a,b){return b?Math.round(a/b*100):0}
const run=()=>S.ses.find(x=>x.st==='running');

function hoje(){
const td=S.ses.filter(x=>day(x.ps)===day(Date.now())).sort((a,b)=>a.ps-b.ps),pl=td.reduce((a,x)=>a+plan(x),0),ex=td.reduce((a,x)=>a+act(x),0);
const n=td.find(x=>x.st==='planned'),rest=td.filter(x=>x!==n),cp=S.caps.filter(x=>!x.type),[c,nx]=cur();
const d=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}),pj=n&&S.proj.find(p=>p.id===n.proj);
return `<h1>Hoje</h1><p class="sub" style="margin:0 0 28px">${d}</p>
<h2 style="margin-top:0">O que fazer agora</h2>
${n?`<div class="run"><p style="margin:0;font-size:24px;font-weight:500;overflow-wrap:anywhere">${esc(n.task)}</p><p class="sub">${hm(n.ps)} a ${hm(n.pe)} · ${dur(plan(n))}${pj?' · '+esc(pj.name):''}</p><button class="b p fbtn" style="width:100%;margin-top:16px" data-a="go" data-id="${n.id}">Iniciar sessão</button></div>`:`<div class="run"><p style="margin:0">Nada planejado ainda.</p><p class="sub">Reserve um horário para a próxima coisa ou tire da cabeça o que estiver pendente.</p><div class="acts" style="margin-top:14px"><button class="b p" data-a="nav" data-v="sessoes">Planejar sessão</button><button class="b" data-a="cap">Captura rápida</button></div></div>`}
${rest.length?'<h2>Outras sessões de hoje</h2>'+rest.map(sr).join(''):''}
<h2>Capturas recentes</h2>
${cp.length?cp.slice(-3).reverse().map(x=>`<div class="row"><div class="t">${esc(x.t)}</div></div>`).join('')+`<div class="row"><span class="m">${cp.length} para organizar</span><button class="b" data-a="nav" data-v="entrada">Abrir Entrada</button></div>`:'<div class="empty">Nada esperando organização.</div>'}
<h2>Rotina</h2><div class="row"><div class="t">Agora: ${c}${nx?`<div class="m">Em seguida: ${nx}</div>`:''}</div></div>
<p class="sub" style="margin-top:36px;font-size:13px">Hoje: ${dur(ex)} executados de ${dur(pl)} planejados${pl?' ('+pct(ex,pl)+'%)':''}</p>`}
function entrada(){
const inb=S.caps.filter(x=>!x.type),tk=S.caps.filter(x=>x.type==='Tarefa'&&!x.done),nt=S.caps.filter(x=>x.type==='Nota');
const pn=x=>{const p=S.proj.find(q=>q.id===x.proj);return p?esc(p.name):''};
return `<h1>Entrada</h1><p class="sub">Capture agora. Organize depois.</p>
<h2>Para organizar (${inb.length})</h2>
${inb.length?`<div class="note"><b>Tarefa</b>: algo que você pode fazer direto. <b>Projeto</b>: resultado maior, com várias ações. <b>Ideia</b>: guardar sem virar obrigação. <b>Nota</b>: só informação.<br>Ex.: "Estudar marketing" é tarefa. "Criar o novo site da Mabelle" é projeto. "Criar um app de networking" pode ser só uma ideia.</div>`+inb.map(x=>`<div class="row" style="align-items:flex-start"><div class="t">${esc(x.t)}<div class="m">${new Date(x.ts).toLocaleDateString('pt-BR')} ${hm(x.ts)}</div></div><div class="acts">${['Tarefa','Projeto','Ideia','Nota'].map(t=>`<button class="b" data-a="cv" data-id="${x.id}" data-t="${t}">${t}</button>`).join('')}<button class="b" data-a="dc" data-id="${x.id}">Excluir</button></div></div>`).join(''):'<div class="empty">Entrada vazia. Nada para organizar.</div>'}
<h2>Tarefas (${tk.length})</h2>
${tk.length?tk.map(x=>`<div class="row"><div class="t">${esc(x.t)}${pn(x)?`<div class="m">${pn(x)}</div>`:''}</div><div class="acts"><button class="b" data-a="pl" data-id="${x.id}">Planejar</button><button class="b" data-a="dn" data-id="${x.id}">Feita</button></div></div>`).join(''):'<div class="empty">Nenhuma tarefa aberta.</div>'}
${nt.length?'<h2>Notas</h2>'+nt.map(x=>`<div class="row"><div class="t">${esc(x.t)}</div><button class="b" data-a="dc" data-id="${x.id}">Excluir</button></div>`).join(''):''}`}
function projetos(){
const at=S.proj.filter(p=>p.st==='ativo'),L=S.proj.filter(p=>p.st!=='concluído'),hrs=p=>S.ses.filter(s=>s.proj===p.id).reduce((a,s)=>a+act(s),0);
const tks=p=>S.caps.filter(c=>c.type==='Tarefa'&&c.proj===p.id&&!c.done),ns=p=>S.ses.filter(s=>s.proj===p.id&&s.rs);
return `<h1>Projetos</h1><p class="sub">Projeto = resultado maior. Se pode ser feito diretamente, provavelmente é uma tarefa.</p>
<div class="f" style="margin-top:20px"><label class="w">Nome<input id="pn"></label><label class="w">Objetivo (o resultado que você quer)<input id="pg" placeholder="Ex.: Ter o site da loja no ar"></label><label class="w">Próxima ação<input id="pa" placeholder="Executável agora. Ex.: Criar a seção inicial da página"></label><button class="b p w" data-a="np">Criar projeto</button></div>
${at.length>3?'<p class="note">Você já possui vários projetos ativos. Considere concluir ou pausar um antes de iniciar outro.</p>':''}
<h2>Ativos e pausados</h2>
${L.length?L.map(p=>`<div class="row" style="align-items:flex-start"><div class="t"><b style="font-weight:500">${esc(p.name)}</b> <span class="m">${p.st} · ${dur(hrs(p))} investidos · ${ns(p).length} sessões${ns(p).length?', última em '+new Date(Math.max(...ns(p).map(s=>s.rs))).toLocaleDateString('pt-BR'):''}</span>
<input data-ch="pg" data-id="${p.id}" value="${esc(p.goal||'')}" placeholder="Objetivo" style="margin-top:8px">
<input data-ch="nx" data-id="${p.id}" value="${esc(p.next||'')}" placeholder="Próxima ação: concreta e executável" style="margin-top:8px">
${tks(p).map(c=>`<div class="m" style="margin-top:8px">${esc(c.t)} <button class="b" data-a="dn" data-id="${c.id}" style="padding:4px 8px">Feita</button></div>`).join('')}
<input data-ch="pt" data-id="${p.id}" placeholder="Adicionar tarefa" style="margin-top:8px"></div><div class="acts"><button class="b" data-a="ps" data-id="${p.id}">${p.st==='ativo'?'Pausar':'Retomar'}</button><button class="b" data-a="cc" data-id="${p.id}">Concluir</button></div></div>`).join(''):'<div class="empty">Nenhum projeto.</div>'}
${S.proj.some(p=>p.st==='concluído')?'<h2>Concluídos</h2>'+S.proj.filter(p=>p.st==='concluído').map(p=>`<div class="row"><div class="t">${esc(p.name)}</div><span class="m">${dur(hrs(p))}</span></div>`).join(''):''}`}
const SL={planned:'Planejada',running:'Em execução',done:'Concluída',abandoned:'Interrompida'};
const sr=x=>{const p=S.proj.find(q=>q.id===x.proj),a=act(x),d=a-plan(x);return `<div class="row"><div class="t">${esc(x.task)}<div class="m">${hm(x.ps)} a ${hm(x.pe)} · ${esc(x.cat)}${p?' · '+esc(p.name):''}</div>${x.rs?`<div class="m">Início real ${hm(x.rs)}${x.re?', fim '+hm(x.re):''} · planejado ${dur(plan(x))}, executado ${dur(a)}${x.st==='running'?'':' ('+(d<0?'−':'+')+dur(Math.abs(d))+')'}</div>`:''}</div>${x.st==='planned'?`<button class="b p" data-a="go" data-id="${x.id}">Iniciar</button>`:`<span class="m">${SL[x.st]}</span>`}</div>`};
function sessoes(){
const td=S.ses.filter(x=>day(x.ps)===day(Date.now())).sort((a,b)=>a.ps-b.ps),old=S.ses.filter(x=>day(x.ps)!==day(Date.now())).sort((a,b)=>b.ps-a.ps).slice(0,10);
const pre=window.PRE||'';window.PRE='';
return `<h1>Sessões</h1><p class="sub">Sessão = tempo reservado para executar.</p>
<div class="f" style="margin-top:20px"><label class="w">O que você vai fazer?<input id="st" list="tl" value="${esc(pre)}" placeholder="Ex.: Estudar inglês"><datalist id="tl">${S.caps.filter(x=>x.type==='Tarefa'&&!x.done).map(x=>`<option value="${esc(x.t)}">`).join('')}</datalist></label>
<label>Categoria<select id="sc">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
<label>Projeto (opcional)<select id="sp"><option value="">Nenhum</option>${S.proj.filter(p=>p.st==='ativo').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
<label>Início<input type="time" id="s1" value="19:00"></label><label>Fim<input type="time" id="s2" value="20:00"></label>
<button class="b p w" data-a="ns">Planejar sessão</button></div>
<h2>Hoje</h2>${td.length?td.map(sr).join(''):'<div class="empty">Nenhuma sessão hoje.</div>'}
${old.length?'<h2>Anteriores</h2>'+old.map(sr).join(''):''}`}
function calc(days){
const lim=Date.now()-days*864e5,L=S.ses.filter(x=>x.ps>=lim&&x.st!=='planned'&&x.st!=='running'||x.ps>=lim&&x.st==='planned'&&x.pe<Date.now());
const pl=L.reduce((a,x)=>a+plan(x),0),ex=L.reduce((a,x)=>a+act(x),0);
const dn=L.filter(x=>x.st==='done'),ab=L.filter(x=>x.st==='abandoned');
const st=L.filter(x=>x.rs),dl=st.length?st.reduce((a,x)=>a+Math.max(0,(x.rs-x.ps)/6e4),0)/st.length:0;

if(!u){ref=null;window.MOS_USER='';try{localStorage.removeItem('mos.in')}catch(e){}lg.classList.add('on');return}
try{localStorage.setItem('mos.in','1')}catch(e){}
window.MOS_USER=u.email;ref=doc(db,'users',u.uid,'data','state');lg.classList.remove('on');
try{const x=await getDoc(ref),l=window.MOS.get();
if(x.exists()){const c=JSON.parse(x.data().json),ct=x.data().t||0;
if(l._uid!==u.uid){const m=merge(l,c);m._uid=u.uid;m._t=Date.now();window.MOS.set(m);push()}
else if(ct>(l._t||0))window.MOS.set({...c,_uid:u.uid});
else if(ct<(l._t||0))push()}
else{l._uid=u.uid;window.MOS.set(l);push()}
render();toast('Conta conectada')}catch(e){toast('Sem acesso ao banco (veja as regras do Firestore)')}});
const go=async cr=>{const e=$('#lge').value.trim(),p=$('#lgp').value;msg('');if(!e||!p)return msg('Digite e-mail e senha.');try{await(cr?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,e,p)}catch(x){msg(ERR[x.code]||'Não foi possível entrar ('+x.code+').')}};
$('#lgi').onclick=()=>go(false);$('#lgc').onclick=()=>go(true);
$('#lgp').onkeydown=ev=>{if(ev.key==='Enter')go(false)};
window.signOutMOS=async()=>{try{if(ref)await setDoc(ref,body())}catch(e){return toast('Não foi possível salvar na nuvem. Tente com internet.')}await signOut(auth);window.MOS.reset()};
}catch(e){console.warn(e);window.MOS_READY=true;lg.classList.add('on');msg('Erro ao iniciar o Firebase: '+(e.code||e.message))}
</script>
</body>
